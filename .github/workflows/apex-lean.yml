name: APEX Lean build and axiom check
on:
  push:
    branches: [research/fbs3r-apex]
    paths: ['APEX/**', '.github/workflows/apex-lean.yml']
  pull_request:
    paths: ['APEX/**']
  workflow_dispatch:
    inputs:
      large:
        description: 'Run the large certificates (blockade n<=22, m<=3; PXP n<=18, m<=5)'
        type: boolean
        default: false
jobs:
  apex:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        working-directory: APEX/Lean
        run: lake exe cache get
      - name: Build
        working-directory: APEX/Lean
        run: lake build
      - name: Negative tests of the certification gate
        run: python3 -I APEX/tests/test_cert_check.py
      - name: Check axioms against the accepted-theorem registry
        run: bash APEX/ci_check.sh
      - name: Exact-integer certificates (CI budget)
        run: |
          python3 -I APEX/Certificates/pxp_verify.py 15 4
          python3 -I APEX/Certificates/blockade_verify.py 16 2
      - name: Large certificates (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.large }}
        run: |
          python3 -I APEX/Certificates/blockade_verify.py 22 3
          python3 -I APEX/Certificates/pxp_verify.py 18 5
